<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="84" height="84" role="img" aria-label="StackCart icon">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="135%" y2="135%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="8" y="8" width="68" height="68" rx="16" fill="url(#iconBg)" filter="url(#iconShadow)"/>

  <!-- Stack layers (3 bars) -->
  <rect x="18" y="18" width="30" height="5" rx="2.5" fill="white" opacity="0.45"/>
  <rect x="18" y="26" width="38" height="5" rx="2.5" fill="white" opacity="0.65"/>
  <rect x="18" y="34" width="34" height="5" rx="2.5" fill="white" opacity="0.90"/>

  <!-- Shopping cart handle -->
  <line x1="18" y1="47" x2="22" y2="47" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="47" x2="20" y2="50" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Basket -->
  <rect x="20" y="50" width="28" height="14" rx="3" fill="white" opacity="0.95"/>
  <!-- Basket dividers -->
  <line x1="29" y1="50" x2="29" y2="64" stroke="#2563eb" stroke-width="1.2" opacity="0.4"/>
  <line x1="38" y1="50" x2="38" y2="64" stroke="#2563eb" stroke-width="1.2" opacity="0.4"/>
  <!-- Wheels -->
  <circle cx="25" cy="69" r="3.5" fill="white" opacity="0.9"/>
  <circle cx="25" cy="69" r="1.5" fill="#2563eb"/>
  <circle cx="43" cy="69" r="3.5" fill="white" opacity="0.9"/>
  <circle cx="43" cy="69" r="1.5" fill="#2563eb"/>

</svg>
